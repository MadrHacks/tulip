name: Build & Push Images to GHCR

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ghcr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: tulip-frontend
            context: frontend
            file: frontend/Dockerfile-frontend
          - name: tulip-api
            context: services/api
            file: services/api/Dockerfile-api
          - name: tulip-assembler
            context: services/go-importer
            file: services/go-importer/Dockerfile
            target: assembler
          - name: tulip-enricher
            context: services/go-importer
            file: services/go-importer/Dockerfile
            target: enricher
          - name: tulip-flagids
            context: services/flagids
            file: services/flagids/Dockerfile
          - name: tulip-timescale
            context: services/timescale
            file: services/timescale/Dockerfile
          - name: tulip-suricata
            context: services/suricata
            file: services/suricata/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
